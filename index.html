<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SimuLab LMS — Applied Agentic AI Platform</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0A1628;--navy2:#0F2040;--navy3:#1A3055;
  --teal:#00D4AA;--teal2:#00B08C;--teal3:#E0FDF6;--teal4:rgba(0,212,170,.12);
  --amber:#F59E0B;--amber2:#FEF3C7;--amber3:#92400E;
  --purple:#7C3AED;--purple2:#EDE9FE;--purple3:#5B21B6;
  --coral:#EF4444;--coral2:#FEE2E2;
  --green:#10B981;--green2:#D1FAE5;--green3:#065F46;
  --blue:#3B82F6;--blue2:#EFF6FF;--blue3:#1E40AF;--blue4:#BFDBFE;
  --g1:#F8FAFC;--g2:#F1F5F9;--g3:#E2E8F0;--g4:#CBD5E1;
  --g5:#94A3B8;--g6:#64748B;--g7:#475569;--g8:#334155;--g9:#1E293B;
  --text:#0F172A;--text2:#334155;--text3:#64748B;
  --white:#fff;
  --r:12px;--r-sm:8px;--r-lg:16px;--r-xl:20px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 4px 12px rgba(0,0,0,.08);
  --sh-lg:0 10px 24px rgba(0,0,0,.1);
}
body{font-family:'Inter',sans-serif;background:var(--g1);color:var(--text);min-height:100vh}
button{cursor:pointer;font-family:'Inter',sans-serif;border:none;background:none}
input,textarea,select{font-family:'Inter',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--g4);border-radius:3px}

/* ── Shell ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:236px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Sidebar ── */
.sl-logo{padding:22px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sl-wordmark{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#fff}
.sl-wordmark span{color:var(--teal)}
.sl-tagline{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:.8px;margin-top:2px}
.sl-section{padding:16px 12px 6px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.22);letter-spacing:1.2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 6px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;font-weight:500;transition:all .15s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-item.active{background:var(--teal4);color:var(--teal)}
.nav-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);flex-shrink:0;transition:background .15s}
.nav-item.active .nav-dot{background:var(--teal)}
.nav-badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:10px;font-size:9.5px;font-weight:700;padding:1px 6px}
.sl-user{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.07)}
.user-row{display:flex;align-items:center;gap:9px}
.u-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.u-name{font-size:13px;font-weight:600;color:#fff}
.u-role{font-size:10px;color:rgba(255,255,255,.3)}

/* ── Topbar ── */
.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--g3);padding:0 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 0 var(--g3)}
.tb-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--text)}
.tb-sub{font-size:11.5px;color:var(--g5);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:34px;height:34px;border:1px solid var(--g3);border-radius:var(--r-sm);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--g6);cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--g2)}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:22px 26px}

/* ── Cards ── */
.card{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.card-lg{background:var(--white);border:1px solid var(--g3);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sh)}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.stat-label{font-size:11.5px;color:var(--text3);font-weight:500;margin-bottom:5px}
.stat-val{font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text);line-height:1}
.stat-chg{font-size:11px;margin-top:4px}
.up{color:var(--green)}.dn{color:var(--coral)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;transition:all .15s;cursor:pointer;border:none}
.btn-primary{background:var(--teal);color:var(--navy)}
.btn-primary:hover{background:var(--teal2)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--white);color:var(--text2);border:1px solid var(--g3)}
.btn-secondary:hover{background:var(--g2)}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid transparent}
.btn-ghost:hover{background:var(--g2);color:var(--text2)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy2)}
.btn-sm{padding:5px 12px;font-size:12.5px}
.btn-lg{padding:11px 22px;font-size:14.5px}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-teal{background:var(--teal3);color:var(--green3)}
.b-amber{background:var(--amber2);color:var(--amber3)}
.b-purple{background:var(--purple2);color:var(--purple3)}
.b-red{background:var(--coral2);color:#991B1B}
.b-green{background:var(--green2);color:var(--green3)}
.b-gray{background:var(--g2);color:var(--g7)}
.b-navy{background:rgba(10,22,40,.07);color:var(--navy)}
.b-blue{background:var(--blue2);color:var(--blue3)}

/* ── Progress bar ── */
.pbar{height:5px;background:var(--g3);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:9px 13px;text-align:left;border-bottom:1px solid var(--g3);background:var(--g1)}
td{padding:12px 13px;font-size:13px;border-bottom:1px solid var(--g2);color:var(--text2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--g1)}

/* ── Forms ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12.5px;font-weight:500;color:var(--text2);margin-bottom:5px}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--g3);border-radius:var(--r-sm);font-size:13.5px;color:var(--text);background:var(--white);outline:none;transition:border .15s}
.form-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,170,.1)}
.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--g3);border-radius:var(--r-sm);font-size:13.5px;color:var(--text);resize:vertical;min-height:90px;outline:none;transition:border .15s}
.form-textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,170,.1)}
.form-select{width:100%;padding:8px 12px;border:1px solid var(--g3);border-radius:var(--r-sm);font-size:13.5px;color:var(--text);background:var(--white);outline:none;appearance:none}

/* ── Tabs ── */
.tabs{display:flex;gap:3px;background:var(--g2);padding:3px;border-radius:var(--r-sm);width:fit-content;margin-bottom:16px}
.tab{padding:5px 14px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--text3);transition:all .15s}
.tab.active{background:var(--white);color:var(--text);box-shadow:var(--sh)}

/* ── Pill tabs ── */
.pill-tabs{display:flex;gap:5px;margin-bottom:14px}
.pill-tab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.pill-tab.active{background:var(--navy);color:#fff}
.pill-tab:not(.active){background:var(--g2);color:var(--g6)}
.pill-tab:not(.active):hover{background:var(--g3)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px}
.modal{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-hd{padding:22px 24px 0;display:flex;align-items:flex-start;justify-content:space-between}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600}
.modal-body{padding:18px 24px}
.modal-ft{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}

/* ── Course cards ── */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px}
.course-card{background:var(--white);border:1px solid var(--g3);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.course-card:hover{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,170,.08),var(--sh-md);transform:translateY(-1px)}
.course-thumb{height:130px;display:flex;align-items:center;justify-content:center;position:relative}
.course-body{padding:14px 16px}
.course-title{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.course-meta{font-size:11.5px;color:var(--text3);margin-bottom:8px}

/* ── Task cards ── */
.task-item{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:all .15s;border-left-width:3px}
.task-item:hover{box-shadow:var(--sh-md)}

/* ── Chat bubbles ── */
.bubble-user{background:var(--navy);color:#fff;border-radius:12px 12px 4px 12px;padding:10px 14px;font-size:13.5px;max-width:82%;margin-left:auto;margin-bottom:10px;line-height:1.55}
.bubble-ai{background:var(--white);border:1px solid var(--g3);border-radius:12px 12px 12px 4px;padding:10px 14px;font-size:13.5px;max-width:86%;margin-bottom:10px;line-height:1.65;color:var(--text2)}

/* ── Typing ── */
.typing{display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--g4);animation:bounce .65s infinite}
.dot:nth-child(2){animation-delay:.1s}.dot:nth-child(3){animation-delay:.2s}

/* ── Video player ── */
.vplayer{background:var(--navy);border-radius:var(--r);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.play-btn{width:58px;height:58px;background:rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25);transition:all .2s}
.play-btn:hover{background:rgba(0,212,170,.2);border-color:var(--teal);transform:scale(1.06)}
.vcontrols{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:14px;display:flex;align-items:center;gap:10px}

/* ── Onboarding ── */
.ob-shell{min-height:100vh;background:linear-gradient(135deg,var(--navy) 0%,#0F2A4A 55%,#0A3040 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.ob-card{background:var(--white);border-radius:22px;padding:38px 46px;width:100%;max-width:490px;box-shadow:0 24px 48px rgba(0,0,0,.22)}
.step-dots{display:flex;gap:7px;margin-bottom:28px;justify-content:center}
.sdot{height:7px;border-radius:4px;background:var(--g3);transition:all .3s}
.sdot.active{width:22px;background:var(--teal)}
.sdot.done{width:7px;background:var(--teal);opacity:.35}
.sdot:not(.active):not(.done){width:7px}

/* ── Community / AI Feed ── */
.engine-panel{background:linear-gradient(135deg,#0A1628 0%,#053528 100%);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;border:1px solid rgba(0,212,170,.14)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s ease-in-out infinite;flex-shrink:0}
.gen-btn{display:flex;align-items:center;gap:7px;width:100%;padding:8px 11px;border-radius:var(--r-sm);font-size:11.5px;font-weight:500;cursor:pointer;margin-bottom:5px;transition:all .15s;border:1px solid;text-align:left}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-btn.ts{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.28);color:#93C5FD}
.gen-btn.ts:hover:not(:disabled){background:rgba(59,130,246,.16)}
.gen-btn.sb{background:rgba(0,212,170,.07);border-color:rgba(0,212,170,.22);color:#5EEAD4}
.gen-btn.sb:hover:not(:disabled){background:rgba(0,212,170,.15)}
.ai-post{border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh-md);animation:fadeIn .3s ease both}
.student-post{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh);animation:fadeIn .3s ease both}
.post-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.reply-bubble{flex:1;background:var(--g1);border-radius:8px;padding:7px 10px}
.reply-input{width:100%;padding:7px 10px;border:1px solid var(--g3);border-radius:var(--r-sm);font-size:12.5px;outline:none;transition:border .15s}
.reply-input:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(0,212,170,.1)}
.engagement-box{border-radius:var(--r-sm);padding:11px 14px;margin:12px 0 4px;border:1px solid}
.sprint-box{background:var(--g1);border:1px solid var(--g3);border-radius:var(--r-sm);padding:12px;margin-top:10px}
.post-actions{display:flex;align-items:center;gap:12px;padding-top:11px;margin-top:11px;border-top:1px solid var(--g2)}
.action-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--g5);cursor:pointer;background:none;border:none;transition:color .15s;padding:0;font-family:'Inter',sans-serif}
.action-btn:hover{color:var(--g7)}
.action-btn.liked{color:var(--coral);font-weight:600}
.schedule-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--g2)}
.schedule-row:last-child{border-bottom:none}

/* ── Eval ── */
.eval-score{font-size:46px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1}
.criterion-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--g2)}
.criterion-row:last-child{border-bottom:none}

/* ── Side cards ── */
.side-card{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:15px;margin-bottom:13px;box-shadow:var(--sh)}
.side-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text);margin-bottom:11px}

/* ── Animations ── */
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

    const prompt=`You are an expert MBA educator evaluating a student assignment for an Applied Agentic AI program.

      setResult(JSON.parse(raw));
    }catch(e){
      setResult({score:Math.floor(task.points*.78),percentage:78,grade:"B+",summary:"Solid submission demonstrating good understanding of core concepts. The agent design shows practical thinking, though the implementation could be more robust.",criteria:[{name:"Conceptual understanding",score:20,max:25,comment:"Good grasp of agentic AI principles. Could elaborate more on the reasoning layer."},{name:"Technical execution",score:19,max:25,comment:"n8n workflow is well-structured. Add error handling for production readiness."},{name:"Business relevance",score:21,max:25,comment:"Clear business case articulated. ROI framing is strong."},{name:"Clarity & structure",score:18,max:25,comment:"Well-organised. Some sections need more specific examples."}],strengths:["Clear problem framing","Practical n8n implementation"],improvements:["Add memory layer using Pinecone","Include error handling and retry logic"],nextStep:"Extend your agent to handle multi-step conversations by adding a vector memory store."});

            <div style={{textAlign:'center',padding:'40px'}}>
              <div className="typing" style={{justifyContent:'center',marginBottom:12}}><div className="dot"/><div className="dot"/><div className="dot"/></div>
              <div style={{fontSize:13.5,color:'var(--text3)'}}>Gemini is evaluating your submission…</div>

          ):result&&(
            <div>
              <div style={{display:'flex',alignItems:'center',gap:18,padding:'18px',background:'var(--g1)',borderRadius:'var(--r)',marginBottom:18}}>

                <div style={{flex:1}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}><span style={{fontFamily:'Space Grotesk',fontSize:22,fontWeight:700,color:sc(result.percentage)}}>{result.grade}</span><span className="badge b-gray">{result.percentage}%</span></div><p style={{fontSize:13,color:'var(--text2)',lineHeight:1.6}}>{result.summary}</p></div>
              </div>
              <h4 style={{fontSize:12.5,fontWeight:600,marginBottom:8}}>Score breakdown</h4>

                  <span style={{fontFamily:'Space Grotesk',fontWeight:600,color:sc((c.score/c.max)*100),flexShrink:0}}>{c.score}/{c.max}</span>
                </div>
              ))}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:14}}>
                <div style={{padding:'11px',background:'var(--green2)',borderRadius:'var(--r-sm)'}}><div style={{fontSize:11.5,fontWeight:600,color:'var(--green3)',marginBottom:5}}>✓ Strengths</div>{result.strengths.map(s=><div key={s} style={{fontSize:12,color:'#0F6E56',marginBottom:3}}>· {s}</div>)}</div>

    if(!apiKey){setGenErr("Add your Google AI Studio API key in Settings first.");return;}
    setGenerating(persona.id);setGenErr('');
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:buildPrompt(persona,dayInfo)}]}],generationConfig:{maxOutputTokens:900,temperature:0.8}})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      const parsed=JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim());
      const np={id:Date.now(),type:persona.id,persona,dayInfo,parsed,likes:0,comments:0,time:"Just now"};
      setPosts(p=>[np,...p]);
      setExpanded(e=>new Set([...e,np.id]));

    setReplyIn(r=>({...r,[postId]:''}));

    const t=(sprintIn[postId]||'').trim();if(!t)return;

// AI STUDY ASSISTANT
// ═══════════════════════════════════════════════════════════════
const AIAssistant=({apiKey})=>{
  const [msgs,setMsgs]=useState([{role:'assistant',content:"Hi! I'm your SimuLab AI study assistant, powered by Gemini. Ask me anything about your courses — n8n agents, Gemini API, Python analytics, AI strategy, or career tips. I'm here 24/7."}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const chatRef=useRef(null);
  const prompts=["Explain vector stores in simple terms","How do I add memory to an n8n agent?","Quiz me before my AI Strategy memo submission","What's the difference between RAG and fine-tuning?","Which AI roles pay best for MBA grads?"];
  useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[msgs,loading]);
  const send=async(text)=>{
    const msg=text||input.trim();if(!msg||loading)return;
    setInput('');setMsgs(m=>[...m,{role:'user',content:msg}]);setLoading(true);
    try{
      const history=[...msgs,{role:'user',content:msg}].map(m=>({role:m.role,content:m.content}));
      const systemPrompt="You are a helpful AI study assistant for SimuLab, an applied agentic AI training program for MBA students at Indian B-schools. Help with: n8n workflows, Gemini API, Python analytics, AI business strategy, career advice for AI-first roles. Keep answers concise, practical, MBA-relevant. Use Indian business examples where helpful.";
      const geminiHistory=history.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey||""}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system_instruction:{parts:[{text:systemPrompt}]},contents:geminiHistory,generationConfig:{maxOutputTokens:600,temperature:0.7}})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      setMsgs(m=>[...m,{role:'assistant',content:data.candidates[0].content.parts[0].text}]);
    }catch(e){setMsgs(m=>[...m,{role:'assistant',content:"Trouble connecting. Check your Gemini API key in Settings — get it free at aistudio.google.com/apikey"}]);}
    setLoading(false);
  };
  return(
    <div style={{display:'grid',gridTemplateColumns:'1fr 230px',gap:18,height:'calc(100vh - 150px)'}}>
      <div style={{display:'flex',flexDirection:'column',background:'var(--white)',border:'1px solid var(--g3)',borderRadius:'var(--r-lg)',overflow:'hidden'}}>
        <div style={{padding:'14px 18px',borderBottom:'1px solid var(--g2)',display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'linear-gradient(135deg,var(--teal),var(--purple))',display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n="ai" s={15} c="white"/></div>
          <div><div style={{fontSize:13,fontWeight:600}}>SimuLab Study Assistant</div><div style={{fontSize:11,color:'var(--green)'}}>● Online · Powered by Gemini</div></div>
        </div>
        <div ref={chatRef} style={{flex:1,overflowY:'auto',padding:'16px'}}>
          {msgs.map((m,i)=><div key={i} className={m.role==='user'?'bubble-user':'bubble-ai'}>{m.content}</div>)}
          {loading&&<div className="bubble-ai" style={{padding:'12px 14px',width:'fit-content'}}><div className="typing"><div className="dot"/><div className="dot"/><div className="dot"/></div></div>}
        </div>
        <div style={{padding:'11px 13px',borderTop:'1px solid var(--g2)',display:'flex',gap:8}}>
          <input className="form-input" placeholder="Ask anything about your courses…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} style={{flex:1}}/>
          <button className="btn btn-primary" onClick={()=>send()} disabled={!input.trim()||loading} style={{flexShrink:0}}><Ic n="send" s={14}/></button>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div className="card-lg"><h4 style={{fontSize:13,fontWeight:600,marginBottom:9}}>Quick questions</h4>{prompts.map(p=><button key={p} onClick={()=>send(p)} className="btn btn-ghost btn-sm" style={{width:'100%',textAlign:'left',justifyContent:'flex-start',marginBottom:5,fontSize:12,lineHeight:1.4,height:'auto',padding:'6px 9px',whiteSpace:'normal'}}>{p} →</button>)}</div>
        <div className="card-lg" style={{background:'var(--teal3)',borderColor:'rgba(0,212,170,.2)'}}><div style={{fontSize:12,fontWeight:600,color:'var(--green3)',marginBottom:3}}>💡 Pro tip</div><p style={{fontSize:12,color:'#0F6E56',lineHeight:1.6}}>Ask the assistant to quiz you before submitting a task. It generates practice questions based on your course content.</p></div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════
const Settings=({apiKey,setApiKey})=>{
  const [local,setLocal]=useState(apiKey);const [saved,setSaved]=useState(false);
  const save=()=>{setApiKey(local);setSaved(true);setTimeout(()=>setSaved(false),2500);};
  return(
    <div style={{maxWidth:540}}>
      <div className="card-lg" style={{marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:14}}><Ic n="key" s={17} c="var(--purple)"/><h3 style={{fontFamily:'Space Grotesk',fontSize:14.5,fontWeight:600}}>Google AI Studio API key</h3></div>
        <p style={{fontSize:13,color:'var(--text3)',marginBottom:13,lineHeight:1.65}}>Powers all AI features — task evaluation, study assistant, community feed personas (TrendScout AI + SimuBot AI). <b style={{color:'var(--green3)'}}>Free to use</b> via Google AI Studio with generous daily limits. Stored only in your browser.</p>
        <div style={{padding:'10px 13px',background:'var(--teal3)',border:'1px solid rgba(0,212,170,.25)',borderRadius:'var(--r-sm)',marginBottom:12,fontSize:12.5,color:'var(--green3)'}}>
          🎉 <b>Free tier:</b> Gemini 2.0 Flash gives you ~1,500 requests/day at zero cost. Perfect for student platforms.
        </div>
        <div className="form-group"><label className="form-label">API key</label><input className="form-input" type="password" placeholder="AIza…" value={local} onChange={e=>setLocal(e.target.value)}/></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-primary" onClick={save}>{saved?'✓ Saved!':'Save key'}</button>
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" className="btn btn-secondary">Get free API key →</a>
        </div>
        {apiKey&&<div style={{marginTop:12,display:'flex',alignItems:'center',gap:7,fontSize:12.5,color:'var(--green3)'}}><Ic n="check" s={14} c="var(--green3)"/>Gemini API key active — all AI features enabled</div>}
      </div>
      <div className="card-lg" style={{marginBottom:14}}>
        <h3 style={{fontFamily:'Space Grotesk',fontSize:14.5,fontWeight:600,marginBottom:14}}>Profile settings</h3>
        <div style={{display:'grid',gap:12}}>
          {[['Full name','Vaibhav'],['Email','vaibhav@simulab.in'],['Institution','SimuLab · Wingfinity Technologies'],['Role','Instructor / Admin']].map(([l,v])=>(
            <div key={l} className="form-group" style={{margin:0}}><label className="form-label">{l}</label><input className="form-input" defaultValue={v}/></div>
          ))}
        </div>
        <button className="btn btn-primary" style={{marginTop:14}}>Save profile</button>
      </div>
      <div className="card-lg" style={{background:'var(--g1)'}}>
        <h3 style={{fontFamily:'Space Grotesk',fontSize:14,fontWeight:600,marginBottom:11}}>🚀 Deploy this LMS</h3>
        <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.8}}>
          {['Drag this file into Vercel.com → instant deploy (free)','Set up Supabase for your database (free tier)','Add Mux or Bunny.net for real video hosting','Connect Razorpay for Indian student payments','Get free Gemini key at aistudio.google.com/apikey → paste above'].map((s,i)=>(
            <div key={i} style={{display:'flex',gap:9,marginBottom:5}}><span style={{color:'var(--purple)',fontWeight:700,flexShrink:0}}>{i+1}.</span><span>{s}</span></div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════════
const App=()=>{
  const [onboarded,setOnboarded]=useState(false);
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [selectedCourse,setSelectedCourse]=useState(null);
  const [evalModal,setEvalModal]=useState(null);
  const [apiKey,setApiKey]=useState('');

  if(!onboarded)return<Onboarding onDone={(f)=>{setUser(f);setOnboarded(true);}}/>;

  const navMain=[{id:'dashboard',label:'Dashboard',icon:'home'},{id:'courses',label:'Courses',icon:'book'},{id:'tasks',label:'Tasks',icon:'task'},{id:'community',label:'Community',icon:'chat'},{id:'progress',label:'Progress',icon:'chart'}];
  const navAdmin=[{id:'admin',label:'Students',icon:'users'},{id:'assistant',label:'AI Assistant',icon:'ai'},{id:'settings',label:'Settings',icon:'settings'}];
  const titles={dashboard:'Dashboard',courses:'Courses',tasks:'Tasks & Evaluations',community:'Community Feed',progress:'My Progress',admin:'Student Management',assistant:'AI Study Assistant',settings:'Settings'};
  const subs={dashboard:`Welcome back, ${user?.name?.split(' ')[0]||'Student'}`,courses:'All enrolled programs',tasks:'Submit work, get AI feedback instantly',community:'TrendScout AI & SimuBot AI post Mon–Sat',progress:'Track your learning journey',admin:'Manage cohorts and monitor progress',assistant:'Ask anything · Available 24/7',settings:'API key, profile & deployment'};
  const activePage=selectedCourse?'courses':page;

  const renderPage=()=>{
    if(selectedCourse)return<CourseDetail course={selectedCourse} onBack={()=>setSelectedCourse(null)}/>;
    switch(page){
      case 'dashboard': return <Dashboard user={user} onNav={(p)=>{setPage(p);}}/>;
      case 'courses': return <Courses onSelect={setSelectedCourse}/>;
      case 'tasks': return <Tasks apiKey={apiKey} onEval={(task,sub)=>setEvalModal({task,sub})}/>;
      case 'community': return <Community apiKey={apiKey}/>;
      case 'progress': return <Progress/>;
      case 'admin': return <Admin/>;
      case 'assistant': return <AIAssistant apiKey={apiKey}/>;
      case 'settings': return <Settings apiKey={apiKey} setApiKey={setApiKey}/>;
      default: return <Dashboard user={user} onNav={setPage}/>;
    }
  };

  return(
    <div className="app">
      <div className="sidebar">
        <div className="sl-logo"><div className="sl-wordmark">Simu<span>Lab</span></div><div className="sl-tagline">APPLIED AGENTIC AI PLATFORM</div></div>
        <div className="sl-section">Student</div>
        {navMain.map(item=>(
          <div key={item.id} className={`nav-item${activePage===item.id?' active':''}`} onClick={()=>{setSelectedCourse(null);setPage(item.id);}}>
            <div className="nav-dot"/><Ic n={item.icon} s={16}/>{item.label}
            {item.id==='tasks'&&<span className="nav-badge">2</span>}
            {item.id==='community'&&<span className="nav-badge" style={{background:'var(--teal)',color:'var(--navy)'}}>AI</span>}
          </div>
        ))}
        <div className="sl-section">Admin</div>
        {navAdmin.map(item=>(
          <div key={item.id} className={`nav-item${activePage===item.id?' active':''}`} onClick={()=>{setSelectedCourse(null);setPage(item.id);}}>
            <div className="nav-dot"/><Ic n={item.icon} s={16}/>{item.label}
          </div>
        ))}
        <div className="sl-user">
          <div className="user-row">
            <div className="u-avatar">{(user?.name||'S').split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
            <div><div className="u-name">{user?.name?.split(' ')[0]||'Student'}</div><div className="u-role">{user?.college?.split(' ')[0]||'SimuLab'} · {user?.batch||'2025'}</div></div>
          </div>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div><div className="tb-title">{selectedCourse?selectedCourse.title:titles[page]}</div><div className="tb-sub">{selectedCourse?selectedCourse.instructor+' · '+selectedCourse.duration:subs[page]}</div></div>
          <div className="tb-right">
            {!apiKey&&<button className="btn btn-secondary btn-sm" onClick={()=>setPage('settings')} style={{borderColor:'var(--amber)',color:'var(--amber)'}}><Ic n="key" s={13} c="var(--amber)"/>Set Gemini key (free)</button>}
            <div className="icon-btn"><Ic n="bell" s={16}/></div>
            <div style={{width:34,height:34,borderRadius:'50%',background:'linear-gradient(135deg,var(--teal),var(--purple))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'white',cursor:'pointer'}}>{(user?.name||'S').split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
          </div>
        </div>
        <div className="content">{renderPage()}</div>
      </div>
      {evalModal&&<AIEvalModal task={evalModal.task} submission={evalModal.sub} apiKey={apiKey} onClose={()=>setEvalModal(null)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
